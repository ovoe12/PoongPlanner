<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우선순위 스케줄러</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #111827;
      --muted: #7a8494;
      --line: #e4e7ec;
      --line-soft: #eef2f7;
      --primary: #2f9df4;
      --urgent: #f43146;
      --high: #ff9718;
      --medium: #ffd232;
      --normal: #38a3e8;
      --low: #5fc94a;
      --minor: #9aa4b2;
      --shadow: 0 18px 50px rgba(17, 24, 39, 0.12);
      --bottom-nav: 76px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Malgun Gothic", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      min-height: 100dvh;
      background: var(--surface);
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 34px;
      padding: 0 18px;
      background: #f8fafc;
      color: #111827;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .ad-strip {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 34px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line-soft);
      color: #344054;
      font-size: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .ad-badge {
      display: inline-grid;
      place-items: center;
      width: 24px;
      min-width: 24px;
      height: 19px;
      border-radius: 4px;
      background: #f59e0b;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      background: #d8edff;
      color: #1e70b7;
      font-weight: 900;
    }

    .month-title {
      margin: 0;
      padding: 5px 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: clamp(21px, 3vw, 29px);
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
    }

    .month-title:hover,
    .month-title:focus-visible {
      background: #eef2f7;
      outline: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #98a2b3;
      font-size: 25px;
      line-height: 1;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      background: #eef2f7;
      color: #344054;
      outline: 0;
    }

    .today-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
    }

    .search-row {
      display: none;
      min-height: 52px;
      padding: 8px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .search-row.active {
      display: block;
    }

    .search-row input {
      width: 100%;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      color: #111827;
    }

    .view {
      display: none;
      min-height: 0;
      padding-bottom: var(--bottom-nav);
      background: #fff;
    }

    .view.active {
      display: block;
    }

    .calendar-view {
      overflow: hidden;
    }

    .calendar-scroll {
      width: 100%;
      height: calc(100dvh - 34px - 34px - 72px - var(--bottom-nav));
      min-height: 620px;
      overflow: auto;
      background: #fff;
    }

    .weekday-row,
    .month-grid {
      min-width: 940px;
    }

    .weekday-row {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      height: 36px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      color: #9aa4b2;
      font-size: 13px;
      font-weight: 800;
    }

    .weekday-row span {
      display: grid;
      place-items: center;
    }

    .weekday-row span:first-child {
      color: #ff4d4f;
    }

    .weekday-row span:last-child {
      color: #111827;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(6, minmax(116px, 1fr));
      height: calc(100% - 36px);
    }

    .day-cell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 116px;
      padding: 7px 5px 6px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
    }

    .day-cell:nth-child(7n) {
      border-right: 0;
    }

    .day-cell.is-other-month {
      background: #fcfcfd;
    }

    .day-head {
      min-height: 25px;
      text-align: center;
    }

    .day-number {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 24px;
      color: #111827;
      font-size: 14px;
      font-weight: 800;
    }

    .day-cell.is-sunday .day-number,
    .holiday-label {
      color: #ff4d4f;
    }

    .day-cell.is-other-month .day-number,
    .day-cell.is-other-month .calendar-event {
      opacity: 0.55;
    }

    .day-cell.is-today .day-number {
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
    }

    .holiday-label {
      display: block;
      margin-top: -2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 800;
    }

    .event-stack {
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
    }

    .calendar-event {
      display: block;
      width: 100%;
      min-height: 21px;
      margin-top: 4px;
      padding: 4px 7px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .priority-urgent {
      background: var(--urgent);
      color: #fff;
    }

    .priority-high {
      background: var(--high);
      color: #fff;
    }

    .priority-medium {
      background: var(--medium);
      color: #4b3700;
    }

    .priority-normal {
      background: var(--normal);
      color: #fff;
    }

    .priority-low {
      background: var(--low);
      color: #fff;
    }

    .priority-minor {
      background: var(--minor);
      color: #fff;
    }

    .priority-school {
      background: #7c6ee6;
      color: #fff;
    }

    .tasks-view {
      min-height: calc(100dvh - 34px - 34px - 72px);
      background: #f8fafc;
      overflow: auto;
    }

    .task-panel {
      max-width: 980px;
      margin: 0 auto;
      padding: 22px 18px 100px;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 16px;
    }

    .task-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .task-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .task-count {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 86px;
      min-height: 32px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #e8f3ff;
      color: #1e70b7;
      font-size: 13px;
      font-weight: 900;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-chip {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .filter-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .task-list {
      display: grid;
      gap: 10px;
    }

    .task-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 76px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-left: 6px solid;
      border-radius: 8px;
      background: #fff;
      text-align: left;
    }

    .task-card.priority-urgent-border {
      border-left-color: var(--urgent);
    }

    .task-card.priority-high-border {
      border-left-color: var(--high);
    }

    .task-card.priority-medium-border {
      border-left-color: var(--medium);
    }

    .task-card.priority-normal-border {
      border-left-color: var(--normal);
    }

    .task-card.priority-low-border {
      border-left-color: var(--low);
    }

    .task-card.priority-minor-border {
      border-left-color: var(--minor);
    }

    .rank {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #eef2f7;
      color: #344054;
      font-size: 14px;
      font-weight: 900;
    }

    .task-title {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .task-score {
      color: #344054;
      font-weight: 900;
      white-space: nowrap;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 220px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }

    .bottom-nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-height: var(--bottom-nav);
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 -12px 28px rgba(17, 24, 39, 0.05);
    }

    .nav-button {
      display: grid;
      place-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #9aa4b2;
      font-size: 12px;
      font-weight: 900;
    }

    .nav-button.active {
      color: var(--primary);
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 7px;
      background: #c4cbd4;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .nav-button.active .nav-icon {
      background: var(--primary);
    }

    .fab {
      position: fixed;
      right: 22px;
      bottom: 96px;
      z-index: 30;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      box-shadow: var(--shadow);
      font-size: 34px;
      line-height: 1;
    }

    dialog {
      width: min(520px, calc(100% - 28px));
      padding: 0;
      border: 0;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    dialog::backdrop {
      background: rgba(17, 24, 39, 0.45);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-close {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #eef2f7;
      color: #344054;
      font-size: 22px;
    }

    .schedule-form {
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .form-row {
      display: grid;
      gap: 7px;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      color: #344054;
      font-size: 13px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    .score-preview {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      color: #344054;
      font-weight: 900;
    }

    .preview-score {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      border-radius: 999px;
      color: #fff;
      font-size: 13px;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
    }

    .left-actions,
    .right-actions {
      display: flex;
      gap: 8px;
    }

    .action-button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #344054;
      font-weight: 900;
    }

    .action-button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .action-button.danger {
      border-color: #fecaca;
      background: #fff5f5;
      color: #d92d20;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      z-index: 60;
      min-width: 180px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      text-align: center;
      font-size: 13px;
      font-weight: 900;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.active {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 760px) {
      .status-bar,
      .ad-strip,
      .topbar {
        padding-right: 12px;
        padding-left: 12px;
      }

      .ad-strip {
        font-size: 12px;
      }

      .toolbar {
        gap: 3px;
      }

      .today-button {
        display: none;
      }

      .calendar-scroll {
        min-height: 610px;
      }

      .weekday-row,
      .month-grid {
        min-width: 760px;
      }

      .month-grid {
        grid-template-rows: repeat(6, 104px);
      }

      .task-header {
        flex-direction: column;
      }

      .task-card {
        grid-template-columns: 38px minmax(0, 1fr);
      }

      .task-score {
        grid-column: 2;
      }

      .two-col {
        grid-template-columns: 1fr;
      }

      .form-actions {
        flex-direction: column-reverse;
      }

      .left-actions,
      .right-actions {
        justify-content: stretch;
      }

      .action-button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="status-bar">
      <span id="statusTime">오후 9:31&nbsp;&nbsp;5월 30일 토요일</span>
    </div>

    <div class="ad-strip">
      <span class="ad-badge">Ad</span>
      <span>우선순위 스케줄러로 오늘의 중요한 일정을 먼저 확인하세요</span>
    </div>

    <header class="topbar">
      <div class="month-control">
        <span class="avatar">나</span>
        <button class="icon-button" type="button" id="prevMonth" aria-label="이전 달">‹</button>
        <button class="month-title" type="button" id="monthTitle" aria-haspopup="dialog">2026년 5월</button>
        <button class="icon-button" type="button" id="nextMonth" aria-label="다음 달">›</button>
      </div>
      <div class="toolbar">
        <button class="today-button" type="button" id="todayButton">오늘</button>
        <button class="icon-button" type="button" id="searchButton" aria-label="검색">⌕</button>
        <button class="icon-button" type="button" id="notifyButton" aria-label="알림">◯</button>
      </div>
    </header>

    <div class="search-row" id="searchRow">
      <input id="searchInput" type="search" placeholder="일정 검색">
    </div>

    <main>
      <section class="view calendar-view active" id="calendarView" data-view="calendar" aria-label="월간 달력">
        <div class="calendar-scroll">
          <div class="weekday-row" aria-hidden="true">
            <span>일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span>토</span>
          </div>
          <div class="month-grid" id="monthGrid"></div>
        </div>
      </section>

      <section class="view tasks-view" id="tasksView" data-view="tasks" aria-label="우선순위 업무">
        <div class="task-panel">
          <div class="task-header">
            <div>
              <h2>업무</h2>
              <p id="taskSubTitle">우선순위 높은 순</p>
            </div>
            <span class="task-count" id="taskCount">0개</span>
          </div>
          <div class="filters" id="categoryFilters" aria-label="카테고리 필터"></div>
          <div class="task-list" id="taskList"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="하단 화면 전환">
      <button class="nav-button active" type="button" data-tab="calendar" aria-controls="calendarView" aria-selected="true">
        <span class="nav-icon">30</span>
        <span>달력</span>
      </button>
      <button class="nav-button" type="button" data-tab="tasks" aria-controls="tasksView" aria-selected="false">
        <span class="nav-icon">✓</span>
        <span>업무</span>
      </button>
    </nav>

    <button class="fab" type="button" id="addButton" aria-label="일정 추가">+</button>
  </div>

  <dialog id="scheduleDialog">
    <div class="modal-head">
      <h2 id="dialogTitle">일정 추가</h2>
      <button class="modal-close" type="button" id="closeDialog" aria-label="닫기">×</button>
    </div>
    <form class="schedule-form" id="scheduleForm">
      <input type="hidden" id="eventId">
      <div class="form-row">
        <label for="titleInput">일정 제목</label>
        <input id="titleInput" type="text" maxlength="40" required>
      </div>
      <div class="two-col">
        <div class="form-row">
          <label for="dateInput">날짜 / 마감일</label>
          <input id="dateInput" type="date" required>
        </div>
        <div class="form-row">
          <label for="categoryInput">카테고리</label>
          <select id="categoryInput" required>
            <option>과제 제출</option>
            <option>수행</option>
            <option>시험</option>
            <option>약속</option>
            <option>기타 일정</option>
          </select>
        </div>
      </div>
      <div class="two-col">
        <div class="form-row">
          <label for="difficultyInput">난이도</label>
          <select id="difficultyInput" required>
            <option>상</option>
            <option>중</option>
            <option>하</option>
          </select>
        </div>
        <div class="form-row">
          <label for="memoInput">메모</label>
          <input id="memoInput" type="text" maxlength="60">
        </div>
      </div>
      <div class="score-preview">
        <span>예상 점수</span>
        <span class="preview-score priority-normal" id="scorePreview">0점</span>
      </div>
      <div class="form-actions">
        <div class="left-actions">

  <script>

      { date: "2026-05-08", title: "체육한마당" },

      { date: "2026-06-03", title: "지방선거" },
      { date: "2026-06-04", title: "대수능모의평가" },

      { date: "2026-07-21", title: "방학식" },
      { date: "2026-09-02", title: "대수능모의평가" },

      { date: "2026-10-05", title: "대체공휴일" },

      { date: "2026-10-27", title: "신입생 학교설명회" },
      { date: "2026-11-18", title: "수능종사요원연수" },
      { date: "2026-11-19", title: "대학수능" },
      { date: "2026-11-19", title: "재량휴업" },
      { date: "2026-11-27", title: "3학년 현장체험학습" },
      { date: "2026-12-02", title: "3학년 현장체험학습" },
      { date: "2026-12-04", title: "3학년 수능점수표 배부" },
      { date: "2026-12-07", title: "2차지필" },
      { date: "2026-12-08", title: "2차지필" },
      { date: "2026-12-09", title: "2차지필" },
      { date: "2026-12-10", title: "2차지필" },
      { date: "2026-12-11", title: "2차지필" },
      { date: "2026-12-23", title: "동아리발표회/축제" },
      { date: "2026-12-25", title: "성탄절" },
      { date: "2026-12-30", title: "방학식" },
      { date: "2027-01-01", title: "신정" },
      { date: "2027-02-01", title: "개학" },
      { date: "2027-02-04", title: "졸업식" },
      { date: "2027-02-04", title: "종업식" }
    ];

    const monthTitle = document.getElementById("monthTitle");
    const monthGrid = document.getElementById("monthGrid");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const taskSubTitle = document.getElementById("taskSubTitle");
    const categoryFilters = document.getElementById("categoryFilters");
    const searchRow = document.getElementById("searchRow");
    const searchInput = document.getElementById("searchInput");
    const statusTime = document.getElementById("statusTime");
    const toast = document.getElementById("toast");
    const dialog = document.getElementById("scheduleDialog");
    const form = document.getElementById("scheduleForm");
    const dialogTitle = document.getElementById("dialogTitle");
    const eventId = document.getElementById("eventId");
    const titleInput = document.getElementById("titleInput");
    const dateInput = document.getElementById("dateInput");
    const categoryInput = document.getElementById("categoryInput");
    const difficultyInput = document.getElementById("difficultyInput");
    const memoInput = document.getElementById("memoInput");
    const scorePreview = document.getElementById("scorePreview");
    const deleteButton = document.getElementById("deleteButton");
    const monthDialog = document.getElementById("monthDialog");
    const monthForm = document.getElementById("monthForm");
    const yearInput = document.getElementById("yearInput");
    const monthInput = document.getElementById("monthInput");

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();
    let activeView = "calendar";
    let activeCategory = "전체";
    let searchQuery = "";
    let events = loadEvents();

    function loadEvents() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
        return [];
      }

      try {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) {
          return parsed.filter((event) => event.title && event.date && event.category && event.difficulty);
        }
      } catch (error) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
      }

      return [];
    }

    function saveEvents() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function toDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function daysLeft(dateKey) {
      const target = parseLocalDate(dateKey);
      const base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      return Math.ceil((target - base) / 86400000);
    }

    function getDeadlineScore(dateKey) {
      const left = daysLeft(dateKey);
      if (left <= 0) return 35;
      if (left <= 3) return 25;
      if (left <= 7) return 15;
      return 5;
    }

    function getScore(event) {
      return (CATEGORY_SCORE[event.category] || 0) + (DIFFICULTY_SCORE[event.difficulty] || 0) + getDeadlineScore(event.date);
    }

    function getPriority(score) {
      if (score >= 105) return "urgent";
      if (score >= 90) return "high";
      if (score >= 75) return "medium";
      if (score >= 60) return "normal";
      if (score >= 45) return "low";
      return "minor";
    }

    function getDday(dateKey) {
      const left = daysLeft(dateKey);
      if (left === 0) return "D-Day";
      if (left > 0) return `D-${left}`;
      return `D+${Math.abs(left)}`;
    }

    function getSortedEvents(source = events) {
      return [...source].sort((a, b) => {
        const scoreDiff = getScore(b) - getScore(a);
        if (scoreDiff !== 0) return scoreDiff;
        return parseLocalDate(a.date) - parseLocalDate(b.date);
      });
    }

    function matchesSearch(event) {
      if (!searchQuery) return true;
      const keyword = searchQuery.toLowerCase();
      return [event.title, event.category, event.difficulty, event.memo]
        .join(" ")
        .toLowerCase()
        .includes(keyword);
    }

    function normalizeTitle(title) {
      return (title || "").replace(/\s+/g, "").replace(/[()]/g, "");
    }

    function shouldShowInTaskList(event) {
      const left = daysLeft(event.date);
      return left >= 0 && left <= 30;
    }

    function renderStatusTime() {
      const now = new Date();
      const timeText = now.toLocaleTimeString("ko-KR", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });
      const dateText = now.toLocaleDateString("ko-KR", {
        month: "long",
        day: "numeric",
        weekday: "long"
      });
      statusTime.textContent = `${timeText}  ${dateText}`;
    }

    function renderMonth() {
      monthTitle.textContent = `${currentYear}년 ${currentMonth + 1}월 ▼`;
      monthGrid.innerHTML = "";

      const firstDay = new Date(currentYear, currentMonth, 1);
      const startDate = new Date(currentYear, currentMonth, 1 - firstDay.getDay());

      for (let index = 0; index < 42; index += 1) {
        const cellDate = new Date(startDate);
        cellDate.setDate(startDate.getDate() + index);
        const dateKey = toDateKey(cellDate);
        const isCurrentMonth = cellDate.getMonth() === currentMonth;
        const isToday = dateKey === toDateKey(today);
        const isSunday = cellDate.getDay() === 0;
        const userDayEvents = getSortedEvents(
          events
            .filter((event) => event.date === dateKey && matchesSearch(event))
            .map((event) => ({ ...event, source: "user" }))
        );
        const schoolDayEvents = SCHOOL_EVENTS
          .filter((event) => event.date === dateKey && matchesSearch(event))
          .filter((event) => normalizeTitle(event.title) !== normalizeTitle(HOLIDAYS[dateKey]))
          .map((event) => ({ ...event, source: "school" }))
          .sort((a, b) => a.title.localeCompare(b.title, "ko"));
        const dayEvents = [...userDayEvents, ...schoolDayEvents];

        const cell = document.createElement("div");
        cell.className = "day-cell";
        if (!isCurrentMonth) cell.classList.add("is-other-month");
        if (isToday) cell.classList.add("is-today");
        if (isSunday) cell.classList.add("is-sunday");
        cell.dataset.date = dateKey;

        const dayHead = document.createElement("div");
        dayHead.className = "day-head";

        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = cellDate.getDate();
        dayHead.appendChild(number);

        if (HOLIDAYS[dateKey]) {
          const holiday = document.createElement("span");
          holiday.className = "holiday-label";
          holiday.textContent = HOLIDAYS[dateKey];
          dayHead.appendChild(holiday);
        }

        const stack = document.createElement("div");
        stack.className = "event-stack";

        dayEvents.forEach((event) => {
          const score = event.source === "school" ? 0 : getScore(event);
          const priority = event.source === "school" ? "school" : getPriority(score);
          const button = document.createElement("button");
          button.type = "button";
          button.className = `calendar-event priority-${priority}`;
          button.textContent = event.title;
          button.title = event.source === "school" ? `${event.title} · 학교 일정` : `${event.title} · ${event.category} · ${score}점`;
          if (event.source === "school") {
            button.setAttribute("aria-label", `${event.title} 학교 일정`);
          } else {
            button.addEventListener("click", () => openEditor(event.id));
          }
          stack.appendChild(button);
        });

        cell.addEventListener("dblclick", () => openEditor(null, dateKey));
        cell.append(dayHead, stack);
        monthGrid.appendChild(cell);
      }
    }

    function renderFilters() {
      categoryFilters.innerHTML = "";
      CATEGORIES.forEach((category) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "filter-chip";
        if (category === activeCategory) button.classList.add("active");
        button.textContent = category;
        button.addEventListener("click", () => {
          activeCategory = category;
          render();
        });
        categoryFilters.appendChild(button);
      });
    }

    function renderTasks() {
      const filtered = getSortedEvents(events)
        .filter(shouldShowInTaskList)
        .filter((event) => activeCategory === "전체" || event.category === activeCategory)
        .filter(matchesSearch);

      taskList.innerHTML = "";
      taskCount.textContent = `${filtered.length}개`;
      taskSubTitle.textContent = activeCategory === "전체" ? "우선순위 높은 순" : `${activeCategory} 우선순위`;

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "30일 이내에 처리할 업무가 없습니다";
        taskList.appendChild(empty);
        return;
      }

      filtered.forEach((event, index) => {
        const score = getScore(event);
        const priority = getPriority(score);
        const row = document.createElement("button");
        row.type = "button";
        row.className = `task-card priority-${priority}-border`;
        row.addEventListener("click", () => openEditor(event.id));

        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = index + 1;

        const body = document.createElement("span");
        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = event.title;
        const meta = document.createElement("span");
        meta.className = "task-meta";
        meta.textContent = `${event.category} · 난이도 ${event.difficulty} · ${getDday(event.date)} · ${event.date}`;
        body.append(title, meta);

        const scoreEl = document.createElement("span");
        scoreEl.className = "task-score";
        scoreEl.textContent = `${score}점`;

        row.append(rank, body, scoreEl);
        taskList.appendChild(row);
      });
    }

    function render() {
      renderMonth();
      renderFilters();
      renderTasks();
    }

    function openEditor(id = null, dateKey = null) {
      const event = id ? events.find((item) => item.id === id) : null;
      dialogTitle.textContent = event ? "일정 수정" : "일정 추가";
      eventId.value = event ? event.id : "";
      titleInput.value = event ? event.title : "";
      dateInput.value = event ? event.date : (dateKey || toDateKey(today));
      categoryInput.value = event ? event.category : "과제 제출";
      difficultyInput.value = event ? event.difficulty : "중";
      memoInput.value = event ? event.memo || "" : "";
      deleteButton.style.visibility = event ? "visible" : "hidden";
      updateScorePreview();
      dialog.showModal();
      titleInput.focus();
    }

    function closeEditor() {
      dialog.close();
      form.reset();
    }

    function openMonthPicker() {
      yearInput.value = currentYear;
      monthInput.value = String(currentMonth);
      monthDialog.showModal();
      yearInput.focus();
    }

    function closeMonthPicker() {
      monthDialog.close();
      monthForm.reset();
    }

    function updateScorePreview() {
      const tempEvent = {
        category: categoryInput.value,
        difficulty: difficultyInput.value,
        date: dateInput.value || toDateKey(today)
      };
      const score = getScore(tempEvent);
      const priority = getPriority(score);
      scorePreview.className = `preview-score priority-${priority}`;
      scorePreview.textContent = `${score}점`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("active");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("active"), 1500);
    }

    function setActiveView(view) {
      activeView = view;
      document.querySelectorAll("[data-view]").forEach((section) => {
        section.classList.toggle("active", section.dataset.view === view);
      });
      document.querySelectorAll("[data-tab]").forEach((button) => {
        const isActive = button.dataset.tab === view;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
      render();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const payload = {
        id: eventId.value || `event-${Date.now()}`,
        title: titleInput.value.trim(),
        date: dateInput.value,
        category: categoryInput.value,
        difficulty: difficultyInput.value,
        memo: memoInput.value.trim()
      };

      if (!payload.title || !payload.date) return;

      const existingIndex = events.findIndex((item) => item.id === payload.id);
      if (existingIndex >= 0) {
        events[existingIndex] = payload;
        showToast("수정되었습니다");
      } else {
        events.push(payload);
        showToast("추가되었습니다");
      }

      saveEvents();
      closeEditor();
      render();
    });

    deleteButton.addEventListener("click", () => {
      const id = eventId.value;
      if (!id) return;
      events = events.filter((event) => event.id !== id);
      saveEvents();
      closeEditor();
      render();
      showToast("삭제되었습니다");
    });

    document.getElementById("addButton").addEventListener("click", () => openEditor());
    document.getElementById("closeDialog").addEventListener("click", closeEditor);
    document.getElementById("cancelButton").addEventListener("click", closeEditor);
    monthTitle.addEventListener("click", openMonthPicker);
    document.getElementById("closeMonthDialog").addEventListener("click", closeMonthPicker);
    document.getElementById("cancelMonthButton").addEventListener("click", closeMonthPicker);
    monthForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const nextYear = Number(yearInput.value);
      const nextMonth = Number(monthInput.value);
      if (!Number.isInteger(nextYear) || nextYear < 1900 || nextYear > 2100) return;
      currentYear = nextYear;
      currentMonth = nextMonth;
      closeMonthPicker();
      render();
    });
    document.getElementById("prevMonth").addEventListener("click", () => {
      currentMonth -= 1;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear -= 1;
      }
      render();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      currentMonth += 1;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear += 1;
      }
      render();
    });
    document.getElementById("todayButton").addEventListener("click", () => {
      currentYear = today.getFullYear();
      currentMonth = today.getMonth();
      render();
    });
    document.getElementById("searchButton").addEventListener("click", () => {
      searchRow.classList.toggle("active");
      if (searchRow.classList.contains("active")) searchInput.focus();
    });
    document.getElementById("notifyButton").addEventListener("click", () => showToast("알림이 없습니다"));
    document.querySelectorAll("[data-tab]").forEach((button) => {
      button.addEventListener("click", () => setActiveView(button.dataset.tab));
    });
    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value.trim();
      render();
    });
    [dateInput, categoryInput, difficultyInput].forEach((input) => {
      input.addEventListener("input", updateScorePreview);
      input.addEventListener("change", updateScorePreview);
    });

    renderStatusTime();
    render();
    window.setInterval(renderStatusTime, 60000);
  </script>
</body>
</html>
